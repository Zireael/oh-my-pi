name: OMP Nix

on:
  # Automatic triggers (push / pull_request / schedule / release /
  # workflow_run / ...) were removed on 2026-10-31. This workflow now
  # runs only when started by hand: Actions tab -> Run workflow, or
  # `gh workflow run <file>`.
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    name: Evaluate flake
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Evaluate every supported system
        run: nix flake check --all-systems --no-build --show-trace
      - name: Verify generated Bun dependencies
        run: nix build --no-link .#checks.x86_64-linux.bun-lock --show-trace
